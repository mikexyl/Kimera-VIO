%YAML:1.0
# Dense Stereo Matching Parameters Configuration File
# This file configures the dense stereo depth estimation for Kimera-VIO

# ============================================================================
# Stereo Depth Method Selection
# ============================================================================
# Choose between different stereo depth estimation algorithms:
# - "OpenCV_BM"      : OpenCV Block Matching (fast, basic quality, CPU only)
# - "OpenCV_SGBM"    : OpenCV Semi-Global Block Matching (good quality, CPU only)
# - "FastFoundationStereo"    : Deep learning stereo (best quality, requires TensorRT)
stereoDepthMethod: "OpenCV_SGBM"

# ============================================================================
# General Stereo Parameters (used by all methods)
# ============================================================================
# Minimum disparity value (typically 0)
minDisparity: 0

# Number of disparity levels to search (must be divisible by 16)
# Higher values allow detecting objects at closer range but increase computation
numDisparities: 128

# Working resolution for dense stereo matching. OpenCV BM/SGBM downsample the
# rectified pair to this size and restore disparity to the camera resolution,
# including the horizontal disparity scale factor.
dispWidth: 640
dispHeight: 480

# Block/window size for matching (must be odd, typically 3-21)
# Larger values give smoother results but less detail
sadWindowSize: 5

# Uniqueness constraint (0-100)
# Higher values ensure more unique matches
uniquenessRatio: 10

# Speckle filter parameters
# Larger window size removes more speckles but may remove small valid regions
speckleWindowSize: 100
speckleRange: 2

# Left-Right disparity consistency check
# Maximum allowed difference (-1 to disable)
disp12MaxDiff: 2

# ============================================================================
# SGBM-Specific Parameters (for OpenCV_SGBM)
# ============================================================================
# P1: Penalty for small disparity changes (pixels with similar intensity)
# Typical value: 8 * channels * block_size^2
P1: 10

# P2: Penalty for large disparity changes
# Typical value: 32 * channels * block_size^2
# Should be larger than P1
P2: 120

# Use Hirschmuller mode (MODE_HH) instead of MODE_SGBM
# MODE_HH is more accurate but slower (OpenCV_SGBM only)
useModeHH: false

# ============================================================================
# Block Matching Parameters (for OpenCV_BM only)
# ============================================================================
# Pre-filter cap for BM algorithm
preFilterCap: 31

# Pre-filter type: 0 = NORMALIZED_RESPONSE, 1 = XSOBEL
preFilterType: 1

# Pre-filter size (must be odd, between 5 and 255)
preFilterSize: 9

# Texture threshold - filters out low-texture regions
textureThreshold: 0

# ============================================================================
# Post-Processing Parameters
# ============================================================================
# Apply median blur to disparity map for noise reduction
medianBlurDisparity: true

# Apply WLS filter for edge-aware smoothing (not yet implemented)
postFilterDisparity: false

# Legacy parameter (kept for backward compatibility)
useSGBM: true

# ============================================================================
# Usage Examples
# ============================================================================
# 
# 1. CPU-only system (no GPU):
#    stereoDepthMethod: "OpenCV_SGBM"
#
# 2. Best quality with TensorRT:
#    stereoDepthMethod: "FastFoundationStereo"
#
# 3. Fastest native processing:
#    stereoDepthMethod: "OpenCV_BM"
#
# 4. Close-range objects:
#    numDisparities: 256
#
# 5. Long-range objects:
#    numDisparities: 64
#
# ============================================================================
# Performance Tuning
# ============================================================================
#
# To improve quality:
# - Increase numDisparities for close objects
# - Use FastFoundationStereo if TensorRT available
#
# To improve speed:
# - Use OpenCV_BM for fastest CPU processing
# - Reduce numDisparities
